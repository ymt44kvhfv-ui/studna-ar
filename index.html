<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studna v AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f4f4f4;
      font-family: system-ui, -apple-system, sans-serif;
      color: #222;
    }
    .viewer-box {
      width: 100%;
      max-width: 680px;
      height: 70vh;
      min-height: 360px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    .popisek {
      margin-top: 14px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
    .ar-tlacitko {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      position: absolute;
      bottom: 16px;
      right: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="viewer-box">
    <model-viewer
      src="studnaa-compressed.glb"
      alt="3D model studny"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1">
      <button slot="ar-button" class="ar-tlacitko">
        Zobrazit v AR
      </button>
    </model-viewer>
  </div>

  <p class="popisek">
    Otoč studnu prstem nebo myší. Na mobilu klepni na <strong>Zobrazit v AR</strong> a umísti ji do prostoru.
  </p>
</body>
</html>
